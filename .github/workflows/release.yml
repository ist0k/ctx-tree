name: release

# Publishes to npm when a v* tag is pushed.
#
# Auth: prefers npm trusted publishing (OIDC) via `id-token: write`. If no
# trusted publisher is configured for the package yet, the npm CLI falls back
# to NODE_AUTH_TOKEN. Once trusted publishing is set up, NPM_TOKEN can be
# deleted and this workflow keeps working unchanged.
#
# Node 24 is used because trusted publishing needs npm >= 11.5.1, which does
# not ship with Node 20 or 22.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC auth and provenance
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never cache in release builds

      - run: npm ci

      # prepublishOnly re-runs typecheck/test/build during `npm publish`; these
      # steps exist so a failure points at the exact stage instead of publish.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Smoke test the real binary against this repo.
      - run: node dist/cli.js --no-copy --depth 2

      - name: verify tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "publishing $pkg"

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
